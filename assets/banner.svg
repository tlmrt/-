<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="开源日历 — 本地日历 · 任务提醒 · MAA 联动">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F6BFF"/>
      <stop offset="55%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2350" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="280" rx="22" fill="url(#bg)"/>
  <circle cx="1085" cy="52" r="150" fill="#ffffff" opacity="0.07"/>
  <circle cx="1180" cy="250" r="110" fill="#ffffff" opacity="0.06"/>
  <circle cx="180" cy="255" r="90" fill="#ffffff" opacity="0.05"/>

  <!-- 日历图标 -->
  <g transform="translate(78, 62)" filter="url(#soft)">
    <rect x="0" y="0" width="132" height="132" rx="26" fill="url(#card)"/>
    <rect x="0" y="0" width="132" height="34" rx="26" fill="#2F42D6"/>
    <rect x="0" y="24" width="132" height="12" fill="#2F42D6"/>
    <circle cx="34" cy="17" r="5.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="98" cy="17" r="5.5" fill="#ffffff" opacity="0.9"/>
    <g fill="#4F6BFF" opacity="0.85">
      <circle cx="34" cy="62" r="7"/>
      <circle cx="66" cy="62" r="7"/>
      <circle cx="98" cy="62" r="7"/>
      <circle cx="34" cy="94" r="7"/>
      <circle cx="66" cy="94" r="7"/>
      <circle cx="98" cy="94" r="7"/>
    </g>
    <circle cx="98" cy="94" r="9" fill="#FF5A5F"/>
  </g>

  <!-- 文字 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif">
    <text x="252" y="126" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="2">开源日历</text>
    <text x="254" y="170" font-size="25" fill="#ffffff" opacity="0.9" letter-spacing="1">本地日历 · 任务到点提醒 · MAA 联动 · 插件扩展</text>
    <text x="254" y="212" font-size="19" fill="#ffffff" opacity="0.72" letter-spacing="0.5">Windows 桌面应用 · 数据全部保存在本机 · MIT 开源</text>
  </g>

  <!-- 右上角标签 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',system-ui,sans-serif">
    <rect x="930" y="196" width="196" height="42" rx="21" fill="#ffffff" opacity="0.16"/>
    <text x="1028" y="224" font-size="19" fill="#ffffff" text-anchor="middle" opacity="0.95">v0.1.0 · MIT</text>
  </g>
</svg>
